analyzer:
  errors:
    # Flutter 3.50+ deprecates `package:flutter/material.dart` in favor of
    # material_ui; ignore until the screens agent migrates UI imports.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml
